<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="45%" stop-color="#141b2d"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#1f2937" stroke-width="1" opacity="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- pulsing glow orb behind center -->
  <circle cx="600" cy="150" r="90" fill="url(#orbGlow)" filter="url(#blur)">
    <animate attributeName="r" values="80;110;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- circuit path drawing animation -->
  <path d="M 100 150 L 300 150 L 340 110 L 480 110 L 520 150 L 700 150" fill="none" stroke="url(#glow)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0,2000;2000,0" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M 1100 170 L 900 170 L 860 210 L 720 210 L 680 170 L 560 170" fill="none" stroke="url(#glow)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0,2000;2000,0" dur="3.5s" begin="0.4s" repeatCount="indefinite"/>
  </path>

  <!-- circuit nodes -->
  <g fill="#58a6ff">
    <circle cx="300" cy="150" r="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="110" r="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="170" r="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="210" r="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating particles rising -->
  <g fill="#a371f7">
    <circle cx="150" cy="280" r="3"><animate attributeName="cy" values="280;20;280" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="300" r="2.5"><animate attributeName="cy" values="300;30;300" dur="7s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="290" r="3"><animate attributeName="cy" values="290;10;290" dur="5.5s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5.5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="300" r="2"><animate attributeName="cy" values="300;40;300" dur="6.5s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="280" r="3"><animate attributeName="cy" values="280;20;280" dur="7.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- center monogram chip -->
  <g transform="translate(600,150)">
    <rect x="-46" y="-46" width="92" height="92" rx="18" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5">
      <animate attributeName="stroke" values="#58a6ff;#a371f7;#58a6ff" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="14" font-family="Fira Code, monospace" font-size="34" font-weight="700" fill="#58a6ff" text-anchor="middle">ZA</text>
  </g>

  <text x="600" y="60" font-family="Fira Code, monospace" font-size="15" fill="#8b949e" text-anchor="middle" letter-spacing="3">SOFTWARE ENGINEER · DATA ANALYST · AI ENGINEER</text>
</svg>
